<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Products | Eboora</title>
<meta name="description" content="Digital products you can download after secure payment.">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#15172b;--muted:#646981;--blue:#3548e8;--line:#e3e5f2;--bg:#f6f7ff}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 56px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:1.6rem;margin:4px 0;letter-spacing:-.02em}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:22px}
.item{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit}
.item img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#eef0fa}
.body{padding:14px 16px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-weight:800;font-size:1.05rem}
.price{font-weight:800;color:var(--blue)}
.mrp{color:var(--muted);text-decoration:line-through;font-weight:500;margin-left:6px}
.cta{margin-top:auto;padding-top:10px;color:var(--blue);font-weight:800}
.empty{background:#fff;border:1px dashed #c9cde3;border-radius:16px;padding:28px;text-align:center;margin-top:22px}
footer{margin-top:40px;color:var(--muted);font-size:.9rem;display:flex;gap:14px;flex-wrap:wrap}
footer a,header a{color:var(--muted)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><div class="muted" style="font-size:.9rem">Digital store</div><h1>Eboora</h1></div>
  <a href="/resend.html">Lost download link?</a>
</header>
<p class="muted">Ek product chunein. Payment ke baad download link email aur confirmation page par milta hai.</p>
<div id="list" class="grid"></div>
<div id="empty" class="empty hidden"><strong>Abhi koi product available nahi hai.</strong><p class="muted">Jaldi wapas dekhiye.</p></div>
<footer><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a><a href="/refund.html">Refund policy</a></footer>
</div>
<script src="/catalog.js" defer></script>
</body>
</html>
