<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Lost your download link? | Eboora-Store</title>
<meta name="theme-color" content="#101426">
<style>
:root{--ink:#15172b;--muted:#646981;--blue:#3548e8;--line:#e3e5f2}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#f6f7ff;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;max-width:460px;width:100%;box-shadow:0 20px 60px #242e7117}
h1{font-size:1.5rem;margin:0 0 8px;letter-spacing:-.02em}
p{color:var(--muted);margin:8px 0}
label{display:block;font-weight:700;font-size:.9rem;margin:16px 0 6px}
input{width:100%;padding:12px;border:1px solid #d9dced;border-radius:10px;font:inherit}
button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{font-weight:600;margin-top:14px}
.ok{color:#137747}.bad{color:#b42318}
.back{display:inline-block;margin-top:18px;font-size:.9rem;color:var(--blue)}
</style>
<link rel="stylesheet" href="/assets/eboora-v44.css?v=44">
<link rel="stylesheet" href="/assets/eboora-v45.css?v=45">
</head>
<body>
<main class="card">
  <h1>Lost your download link?</h1>
  <p>Enter the email you used at checkout. If you have a paid order, we will email your download link again.</p>
  <form id="resendForm" novalidate>
    <label for="resendEmail">Email address</label>
    <input id="resendEmail" name="email" type="email" autocomplete="email" maxlength="160" required>
    <button id="resendBtn" type="submit">Send my download link</button>
  </form>
  <p id="resendMsg" class="msg" role="status" aria-live="polite"></p>
  <a class="back" href="/">Back to the store</a>
</main>
<script src="/resend.js" defer></script>
</body>
</html>
