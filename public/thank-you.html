<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Your download | Eboora-Store</title>
<meta name="theme-color" content="#111827">
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at 18% 8%,#1c4779 0,transparent 35%),linear-gradient(135deg,#071324,#122b4b);color:#10253f;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:#fff;border-radius:26px;padding:clamp(28px,5vw,46px);max-width:520px;width:100%;text-align:center;box-shadow:0 26px 75px #0005;border:1px solid #e4edf8}
h1{margin:0 0 10px;font-size:1.7rem;line-height:1.15}
p{color:#586082;line-height:1.6;margin:8px 0}
.ic{width:64px;height:64px;border-radius:50%;background:#e8f1ff;color:#1764e8;display:grid;place-items:center;font-size:2rem;margin:0 auto 16px}
.ic.ok{background:#E5F7EC;color:#12A150}.ic.bad{background:#FDECEE;color:#D0364B}
.dl{display:block;margin:20px 0 6px;background:#1764e8;color:#fff;font-weight:700;font-size:1.1rem;padding:17px 20px;border-radius:12px;text-decoration:none;box-shadow:0 12px 24px #1764e830}
.small{font-size:.9rem}
@keyframes spin{to{transform:rotate(360deg)}} .spin{animation:spin 1s linear infinite;display:inline-block}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<main class="card" aria-live="polite">
  <p style="font-size:12px;font-weight:800;letter-spacing:2px;color:#1764e8;margin:0 0 22px">EBOORA · SECURE CHECKOUT</p><div class="ic" id="ic"><span class="spin">⟳</span></div>
  <h1 id="title">Confirming your payment…</h1>
  <p id="msg">Please wait a few seconds and keep this page open.</p>
  <a class="dl" id="dl" hidden target="_blank" rel="noopener">Download your files</a>
  <p class="small" id="note" hidden></p>
  <p class="small"><a href="/">← Back to store</a></p>
  <p class="small">Need help? <a id="mail"></a> · <a href="/resend.html">Lost your download link?</a></p>
<p class="small" id="waWrap" hidden><a id="wa" target="_blank" rel="noopener">Message us on WhatsApp</a></p>
</main>
<script src="/thank-you.js" defer></script>
</body>
</html>
