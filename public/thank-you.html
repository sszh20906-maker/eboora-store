<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f7f8fb">
<title>Order status | Eboora</title>
<style>
:root{color-scheme:light;--ink:#202633;--muted:#687386;--line:#e8ebf1;--accent:#d97706;--surface:#fff;--bg:#f6f7fa;--green:#16834b;--red:#c43e4b;--blue:#3466c7}
*{box-sizing:border-box}body{margin:0;min-height:100svh;padding:24px 16px;display:grid;place-items:center;background:radial-gradient(ellipse at 12% 0%,#fff0dc 0,transparent 36%),radial-gradient(ellipse at 100% 100%,#e9efff 0,transparent 38%),var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
.shell{width:min(100%,560px)}.brand{display:flex;align-items:center;justify-content:center;gap:9px;margin:0 0 20px;font-size:13px;font-weight:800;letter-spacing:.13em;color:#4b5565}.brand-mark{width:28px;height:28px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px;letter-spacing:0}
.card{background:rgba(255,255,255,.96);border:1px solid rgba(226,230,238,.9);border-radius:26px;padding:clamp(26px,6vw,44px);box-shadow:0 24px 70px rgba(30,42,65,.09);text-align:center;animation:rise .45s cubic-bezier(.2,.75,.25,1) both}
.icon{width:68px;height:68px;margin:0 auto 21px;border-radius:22px;display:grid;place-items:center;background:#fff1dc;color:var(--accent);font-size:32px;font-weight:700}.icon.ok{background:#e7f7ee;color:var(--green)}.icon.bad{background:#fff0f1;color:var(--red)}.icon.wait{background:#edf2ff;color:var(--blue)}
h1{font-size:clamp(25px,6vw,34px);letter-spacing:-.045em;line-height:1.12;margin:0 0 12px;font-weight:800}#msg{font-size:15px;line-height:1.7;color:var(--muted);max-width:410px;margin:0 auto 23px}
.order{padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:#fafbfc;text-align:left;margin:0 0 18px}.order-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:#8a93a2;margin-bottom:5px}.order-id{font-size:13px;font-weight:700;overflow-wrap:anywhere;color:#414b5c}
.actions{display:grid;gap:10px}.button{display:flex;align-items:center;justify-content:center;min-height:52px;padding:13px 18px;border-radius:14px;background:var(--accent);color:white;text-decoration:none;border:0;font:700 15px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;box-shadow:0 9px 22px #d977062e;transition:transform .2s,box-shadow .2s,background .2s}.button:hover{transform:translateY(-1px);box-shadow:0 12px 26px #d9770638}.button.secondary{background:#fff;color:#354052;border:1px solid var(--line);box-shadow:none}.button[hidden], [hidden]{display:none!important}
.note{font-size:13px;line-height:1.65;color:var(--muted);margin:16px 0 0}.foot{font-size:13px;color:#8992a1;text-align:center;margin:18px 0 0}.foot a{color:#5b6473;text-decoration:none}.foot a:hover{text-decoration:underline}.spin{width:22px;height:22px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:420px){body{padding:18px 12px}.card{border-radius:21px;padding:27px 20px}.icon{width:60px;height:60px;border-radius:19px}#msg{font-size:14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
<link rel="stylesheet" href="/assets/eboora-v44.css?v=44"><link rel="stylesheet" href="/assets/eboora-v45.css?v=45"><link rel="stylesheet" href="/assets/eboora-v46.css?v=46">
</head>
<body><main class="shell" aria-live="polite">
<div class="brand"><span class="brand-mark">E</span><span>EBOORA</span></div>
<section class="card">
<div class="icon wait" id="ic"><span class="spin" aria-label="Loading"></span></div>
<h1 id="title">Confirming your payment</h1><p id="msg">Please wait while we securely verify your order with the payment provider.</p>
<div class="order" id="orderBox" hidden><div class="order-label">Order reference</div><div class="order-id" id="orderIdText"></div></div>
<div class="actions"><a class="button" id="dl" hidden target="_blank" rel="noopener">Download your files</a><button class="button" id="retry" type="button" hidden>Check payment status again</button><a class="button secondary" id="store" href="/" hidden>Back to store</a></div>
<p class="note" id="note" hidden></p>
</section>
<p class="foot">Need help? <a id="mail" href="mailto:customersupport527@gmail.com">customersupport527@gmail.com</a> · <a href="/resend.html">Lost your download link?</a></p>
<p class="foot" id="waWrap" hidden><a id="wa" target="_blank" rel="noopener">Contact support on WhatsApp</a></p>
</main><script src="/thank-you.js" defer></script></body></html>
